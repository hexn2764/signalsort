<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SignalSort</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --ink: #1a1a2e; --muted: #6b7280;
    --line: #e5e7eb; --accent: #5b5bd6;
    --now: #dc2626; --today: #d97706; --later: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111217; --card:#1b1d24; --ink:#f3f4f6; --muted:#9ca3af; --line:#2b2e37; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 20px; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  ul { list-style: none; padding: 0; margin: 24px 0 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; gap: 12px; align-items: baseline; }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 34px; }
  .badge { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    font-weight: 700; padding: 2px 8px; border-radius: 99px; color: #fff; }
  .now { background: var(--now); } .today { background: var(--today); } .later { background: var(--later); }
  .subject { font-weight: 600; }
  .from, .why { color: var(--muted); font-size: 13px; }
  .why { margin-top: 6px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 13px; color: var(--accent); }
  table { border-collapse: collapse; margin-top: 8px; font-size: 13px; width: 100%; }
  td { padding: 3px 8px 3px 0; }
  td.pts { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>SignalSort</h1>
  <p class="sub">Your inbox, ordered by what actually needs you — with the reason shown.</p>
  <button id="go">Triage inbox</button>
  <ul id="out"></ul>
</main>
<script>
  const out = document.getElementById("out");
  document.getElementById("go").addEventListener("click", async () => {
    out.innerHTML = "<li>Scoring…</li>";
    const items = await (await fetch("/api/triage")).json();
    out.innerHTML = items.map(render).join("");
  });

  function render(item) {
    const rows = item.reasons.map(r =>
      `<tr><td>${esc(r.detail)}</td><td class="pts">${r.points > 0 ? "+" : ""}${r.points}</td></tr>`
    ).join("");
    return `<li>
      <div class="row">
        <span class="score">${item.score}</span>
        <span class="badge ${item.bucket}">${item.bucket}</span>
        <span class="subject">${esc(item.message.subject)}</span>
      </div>
      <div class="from">${esc(item.message.from)}</div>
      <div class="why">${esc(item.summary)}</div>
      <details><summary>Score breakdown</summary><table>${rows}</table></details>
    </li>`;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  }
</script>
</body>
</html>
