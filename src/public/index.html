<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SignalSort</title>
<style>
  :root {
    --bg:#f5f6fa; --card:#fff; --ink:#15161c; --muted:#6b7280; --line:#e4e6ec;
    --accent:#5b5bd6; --accent-soft:#eceafd;
    --hot:#dc2626; --warm:#d97706; --cool:#6b7280; --ok:#15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1015; --card:#181a21; --ink:#f2f3f6; --muted:#9aa1ad; --line:#282b34;
      --accent:#8b8bf0; --accent-soft:#232145; --ok:#4ade80;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 20px 60px; background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:940px; margin:0 auto; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  h1 { font-size:26px; margin:0; letter-spacing:-.01em; }
  .repo { color:var(--muted); font-size:13px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  p.sub { color:var(--muted); margin:2px 0 20px; }

  nav { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  nav button { background:none; border:0; border-bottom:2px solid transparent; color:var(--muted);
    padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  nav button[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }

  button.action { background:var(--accent); color:#fff; border:0; border-radius:8px;
    padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  button.action:hover { filter:brightness(1.08); }
  button.ghost { background:none; border:1px solid var(--line); color:var(--ink);
    border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; }

  ul { list-style:none; padding:0; margin:18px 0 0; }
  li.card { background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; gap:11px; align-items:baseline; flex-wrap:wrap; }
  .score { font-variant-numeric:tabular-nums; font-weight:700; font-size:17px; min-width:32px; }
  .badge { font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700;
    padding:2.5px 8px; border-radius:99px; color:#fff; white-space:nowrap; }
  .b-now,.b-proposed { background:var(--hot); } .b-today { background:var(--warm); }
  .b-later,.b-queued { background:var(--cool); } .b-accepted { background:var(--ok); }
  .b-dismissed { background:var(--muted); }
  .title { font-weight:600; }
  .meta,.why { color:var(--muted); font-size:13px; }
  .why { margin-top:5px; }
  .bar { display:flex; gap:3px; margin-top:9px; }
  .seg { height:5px; border-radius:2px; }
  details { margin-top:9px; }
  summary { cursor:pointer; font-size:13px; color:var(--accent); }
  table { border-collapse:collapse; margin-top:7px; font-size:13px; width:100%; }
  td { padding:3px 10px 3px 0; color:var(--muted); }
  td.pts { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
  .cta { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  a { color:var(--accent); }
  .feed { background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:12px 16px; margin-top:22px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12.5px; max-height:250px; overflow:auto; }
  .feed div { padding:2px 0; color:var(--muted); }
  .feed b { color:var(--accent); font-weight:600; }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .dot { width:7px; height:7px; border-radius:99px; background:var(--ok); animation:pulse 1.8s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .empty { color:var(--muted); padding:14px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SignalSort</h1>
    <span class="repo" id="repo"></span>
  </header>
  <p class="sub">Ranking that explains itself — for your inbox, and for its own backlog.</p>

  <nav role="tablist">
    <button role="tab" id="tab-inbox" aria-selected="true">Inbox</button>
    <button role="tab" id="tab-dev" aria-selected="false">Developer view</button>
  </nav>

  <section id="view-inbox">
    <button class="action" id="go">Triage inbox</button>
    <ul id="inbox"></ul>
  </section>

  <section id="view-dev" hidden>
    <div class="cta">
      <button class="action" id="refresh">Refresh backlog</button>
      <span class="live"><span class="dot"></span><span id="livetext">three agents running</span></span>
    </div>
    <ul id="backlog"></ul>
    <div class="feed" id="feed"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let timer = null;

/* ---------- tabs ---------- */
function selectTab(which) {
  const dev = which === "dev";
  $("tab-inbox").setAttribute("aria-selected", String(!dev));
  $("tab-dev").setAttribute("aria-selected", String(dev));
  $("view-inbox").hidden = dev;
  $("view-dev").hidden = !dev;
  clearInterval(timer);
  if (dev) { loadBacklog(); timer = setInterval(loadBacklog, 10000); }
}
$("tab-inbox").onclick = () => selectTab("inbox");
$("tab-dev").onclick = () => selectTab("dev");

/* ---------- tab 1: the product ---------- */
$("go").onclick = async () => {
  $("inbox").innerHTML = "<li class='empty'>Scoring…</li>";
  const items = await (await fetch("/api/triage")).json();
  $("inbox").innerHTML = items.map(renderMessage).join("");
};

function renderMessage(item) {
  const rows = item.reasons.map((r) =>
    `<tr><td>${esc(r.detail)}</td><td class="pts">${r.points > 0 ? "+" : ""}${r.points}</td></tr>`
  ).join("");
  return `<li class="card">
    <div class="row">
      <span class="score">${item.score}</span>
      <span class="badge b-${item.bucket}">${item.bucket}</span>
      <span class="title">${esc(item.message.subject)}</span>
    </div>
    <div class="meta">${esc(item.message.from)}</div>
    <div class="why">${esc(item.summary)}</div>
    <details><summary>Score breakdown</summary><table>${rows}</table></details>
  </li>`;
}

/* ---------- tab 2: the autopilot cockpit ---------- */
async function loadBacklog() {
  try {
    const [data, events] = await Promise.all([
      (await fetch("/api/backlog")).json(),
      (await fetch("/api/events")).json(),
    ]);
    $("repo").textContent = data.repo ?? "";
    $("backlog").innerHTML = data.items.length
      ? data.items.map(renderIssue).join("")
      : "<li class='empty'>Backlog is empty — the reporter agent has not filed anything yet.</li>";
    $("feed").innerHTML = events.length
      ? events.map(renderEvent).join("")
      : "<div>No agent activity recorded yet.</div>";
    $("livetext").textContent = `${data.items.length} open · updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("backlog").innerHTML = `<li class='empty'>Could not read the backlog: ${esc(e.message)}</li>`;
  }
}
$("refresh").onclick = loadBacklog;

function renderIssue(item) {
  const s = item.signals;
  const bar = `<div class="bar">
    ${seg("var(--hot)", s.severity)}${seg("var(--accent)", s.interest)}${seg("var(--cool)", s.effort)}
  </div>`;
  const rows = item.reasons.map((r) => `<tr><td colspan="2">${esc(r)}</td></tr>`).join("");

  let cta = `<span class="meta">waiting for the solver agent</span>`;
  if (item.status === "proposed") {
    cta = `<a href="${esc(item.pr.url)}" target="_blank" rel="noopener">Review PR #${item.pr.number}</a>
      <button class="action" onclick="decide('accept', ${item.pr.number})">Accept · ship it</button>
      <button class="ghost" onclick="decide('dismiss', ${item.pr.number})">I'll do it myself</button>`;
  } else if (item.status === "accepted") {
    cta = `<span class="meta">merged to main via PR #${item.pr.number} — live after CD</span>`;
  } else if (item.status === "dismissed") {
    cta = `<span class="meta">handed back to a human</span>`;
  }

  return `<li class="card">
    <div class="row">
      <span class="score">${item.score}</span>
      <span class="badge b-${item.status}">${item.status}</span>
      <span class="title">${esc(item.title)}</span>
      <span class="meta">#${item.issue}</span>
    </div>
    <div class="why">${esc(item.summary)}</div>
    ${bar}
    <div class="meta" style="margin-top:6px">severity ${s.severity} · interest ${s.interest} · effort ${s.effort}</div>
    <details><summary>Why this score</summary><table>${rows}</table></details>
    <div class="cta">${cta}</div>
  </li>`;
}

function seg(color, value) {
  return `<span class="seg" style="background:${color};width:${value * 18}px"></span>`;
}

function renderEvent(e) {
  const t = new Date(e.at).toLocaleTimeString();
  return `<div>${t} <b>${esc(e.agent)}</b> ${esc(e.action)} — ${esc(e.detail)}</div>`;
}

async function decide(what, pr) {
  $("livetext").textContent = what === "accept" ? `merging PR #${pr}…` : `closing PR #${pr}…`;
  await fetch(`/api/${what}`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ pr }),
  });
  loadBacklog();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}
</script>
</body>
</html>
